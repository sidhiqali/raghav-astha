<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:linear-gradient(160deg,#fbf6ea,#f1e8d6 60%,#ece1cb);font-family:'Cormorant Garamond',Georgia,serif;color:#5b4a2f;text-align:center}
.damask{position:absolute;inset:0;background:url(damask.png) center/260px repeat;mix-blend-mode:multiply;opacity:.28}
.frame{position:absolute;inset:26px;border:1.5px solid #b8923f;box-shadow:inset 0 0 0 6px #fbf6ea,inset 0 0 0 7px #b8923f80}
.seal{position:absolute;left:50%;top:44px;width:118px;transform:translateX(-50%);clip-path:circle(45% at 50% 50%)}
.content{position:absolute;inset:0;padding-top:172px}
.kicker{font-size:22px;letter-spacing:.42em;text-transform:uppercase;font-weight:500;color:#92651f}
.names{font-family:'Pinyon Script',cursive;font-size:126px;line-height:1.1;margin:8px 0 0;color:#a8832e}
.names i{font-style:normal;font-size:.62em}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px auto 14px;color:#b8923f;font-size:18px}
.rule:before,.rule:after{content:'';width:120px;border-top:1px solid #b8923f99}
.date{font-size:34px;letter-spacing:.34em;text-transform:uppercase;font-weight:500}
.note{font-style:italic;font-size:28px;margin-top:8px;color:#7a6440}
</style></head><body>
<div class="damask"></div><div class="frame"></div>
<img class="seal" src="seal-crop.png" alt="">
<div class="content">
  <p class="kicker">We are getting married!</p>
  <p class="names">Raghav <i>&amp;</i> Aastha</p>
  <div class="rule">✦</div>
  <p class="date">25 · 26 · 27 December 2026</p>
  <p class="note">Save the date. Tap the seal to open the invitation.</p>
</div>
</body></html>
