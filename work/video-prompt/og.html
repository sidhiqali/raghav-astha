<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse at 50% 30%,#7a1a2e,#5a0f1f 55%,#3e0812);font-family:'Cormorant Garamond',Georgia,serif;text-align:center}
.damask{position:absolute;inset:0;background:url(damask.png) center/260px repeat;mix-blend-mode:soft-light;opacity:.35}
.frame{position:absolute;inset:26px;border:1.5px solid #d4a848;box-shadow:inset 0 0 0 6px #5a0f1f,inset 0 0 0 7px #d4a84880}
.seal{position:absolute;left:50%;top:44px;width:118px;transform:translateX(-50%);clip-path:circle(45% at 50% 50%)}
.content{position:absolute;inset:0;padding-top:172px}
.kicker{font-family:'Cinzel',serif;font-size:21px;letter-spacing:.34em;text-transform:uppercase;font-weight:500;color:#e4c77d}
.names{font-family:'Pinyon Script',cursive;font-size:126px;line-height:1.1;margin:8px 0 0;color:#d9b45a}
.names i{font-style:normal;font-size:.62em}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px auto 14px;color:#d4a848;font-size:18px}
.rule:before,.rule:after{content:'';width:120px;border-top:1px solid #d4a84899}
.date{font-family:'Cinzel',serif;font-size:33px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;color:#f4e7c9}
.note{font-style:italic;font-size:28px;margin-top:8px;color:#f4e7c9cc}
</style></head><body>
<div class="damask"></div><div class="frame"></div>
<img class="seal" src="seal-crop.png" alt="">
<div class="content">
  <p class="kicker">We are getting married!</p>
  <p class="names">Raghav <i>&amp;</i> Aastha</p>
  <div class="rule">✦</div>
  <p class="date">25 · 26 · 27 December 2026</p>
  <p class="note">Save the date. Tap the seal to open the invitation.</p>
</div>
</body></html>
